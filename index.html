<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f3820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ilê Asé" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Ilê Asé Tonin Ewe Oya</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="logo" id="logo" title="Símbolo do terreiro"></div>
      <h1>
        Ilê Asé Tonin Ewe Oya<small
          >Gestão do terreiro · filhos de santo · finanças · agenda</small
        >
      </h1>
      <div class="hbtns">
        <button class="b g s" onclick="trocaSenha()">🔑 Trocar senha</button>
        <button class="b g s" onclick="meuPerfil()">Meu perfil</button>
        <div
          class="hav"
          id="hav"
          onclick="meuPerfil()"
          title="Meu perfil"
        ></div>
        <button
          class="b g s dots"
          onclick="toggleMenu(event)"
          title="Mais opções"
        >
          ⋮
        </button>
      </div>
      <input
        id="imp"
        type="file"
        accept=".json"
        hidden
        onchange="restore(this)"
      />
    </header>
    <div id="menu" class="menu" hidden></div>

    <main id="app"></main>
    <dialog id="dlg"></dialog>
    <div id="bbar"></div>
    <div id="login" style="display: none"></div>

    <script src="script.js"></script>
  </body>
</html>
